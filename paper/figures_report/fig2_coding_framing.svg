   <g id="text_4">
    <text style="font-weight: 700; font-size: 7px; font-family: 'Arial', 'Microsoft YaHei'; text-anchor: start; fill: #b5533c" x="15.48" y="179.56125" transform="rotate(-0 15.48 179.56125)">分帧元数据的位置决定了失效模式</text>
   </g>
   <g id="text_5">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Microsoft YaHei'; text-anchor: start; fill: #1a1a1a" x="15.48" y="197.495123" transform="rotate(-0 15.48 197.495123)">有外码：2 字节长度前缀位于 RS 码字内部，受 t 字节纠错保护 → 载荷边界正确。</text>
   </g>
   <g id="text_6">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Microsoft YaHei'; text-anchor: start; fill: #1a1a1a" x="15.48" y="215.482014" transform="rotate(-0 15.48 215.482014)">无外码：前缀裸露，单比特错误即破坏长度字段 → 接收端按错误长度切分 → 整条字节流错位。</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.2px; font-family: 'Arial', 'Microsoft YaHei'; text-anchor: start; fill: #6e6e6e" x="15.48" y="234.231326" transform="rotate(-0 15.48 234.231326)">因此外码的作用不止于纠错：它同时是分帧完整性的保护层（研究内容 1 的分帧子问题）。</text>
   </g>
